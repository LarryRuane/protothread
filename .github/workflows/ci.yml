name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # PT_DEBUG and PT_NWAIT change struct layouts and code paths, and NDEBUG
  # changes which checks survive, so every combination gets exercised.
  test:
    name: test (${{ matrix.cc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v5
      - name: Build and run in every configuration
        run: |
          set -euo pipefail
          fail=0
          for cfg in "" \
                     "-DPT_DEBUG=0" \
                     "-DNDEBUG" \
                     "-DNDEBUG -DPT_DEBUG=0" \
                     "-DPT_NWAIT=1" \
                     "-DPT_NWAIT=4" \
                     "-DPT_NWAIT=1 -DPT_DEBUG=0 -DNDEBUG" ; do
            for opt in -O0 -O1 -O2 -O3 -Os ; do
              printf '%-42s %-4s ' "${cfg:-(default)}" "$opt"
              if ${{ matrix.cc }} $opt $cfg -Wall -Wextra -Werror \
                   protothread_test.c -o pttest 2> err.txt && ./pttest ; then
                echo PASS
              else
                echo FAIL ; sed 's/^/    /' err.txt ; fail=1
              fi
            done
          done
          exit $fail

  standards:
    name: std (${{ matrix.cc }} ${{ matrix.std }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
        std: [c99, c11, c17, c23, gnu99, gnu23]
    steps:
      - uses: actions/checkout@v5
      - run: |
          set -euo pipefail
          # gcc only learned to spell C23 as "c23" in gcc 14; older releases,
          # including the one on ubuntu-24.04, call it "c2x".  Use whichever
          # this compiler understands rather than pinning the runner image.
          std="${{ matrix.std }}"
          probe() {
            echo 'int main(void){return 0;}' \
              | ${{ matrix.cc }} -std="$1" -x c - -o /dev/null 2>/dev/null
          }
          if ! probe "$std" ; then
            alt="${std/23/2x}"
            if [ "$alt" != "$std" ] && probe "$alt" ; then
              echo "note: -std=$std unsupported here, using -std=$alt"
              std="$alt"
            else
              echo "neither -std=$std nor -std=$alt is supported" ; exit 1
            fi
          fi
          ${{ matrix.cc }} -std="$std" -O1 -Wall -Wextra -Werror \
            protothread_test.c -o pttest
          ./pttest

  sanitizers:
    name: sanitizers (${{ matrix.cc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v5
      - name: AddressSanitizer + UndefinedBehaviorSanitizer
        run: |
          set -euo pipefail
          for cfg in "" "-DPT_DEBUG=0 -DPT_NWAIT=1" ; do
            ${{ matrix.cc }} -g -O1 $cfg -fsanitize=address,undefined \
              -fno-sanitize-recover=all -Wall -Wextra -Werror \
              protothread_test.c -o pttest-asan
            ./pttest-asan
          done
      - name: ThreadSanitizer on the worker-pool example
        run: |
          set -euo pipefail
          ${{ matrix.cc }} -g -O1 -fsanitize=thread -Wall -Wextra -Werror \
            protothread_pool_example.c -o ptpool-tsan -lpthread
          ./ptpool-tsan

  # The library claims to run with no C library at all.  That claim is easy
  # to break by accident with one careless #include, so assert it directly.
  freestanding:
    name: freestanding (no libc symbols)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v5
      - run: |
          set -euo pipefail
          cat > freestanding.c <<'EOF'
          #include "protothread.h"
          #include "protothread_sem.h"
          #include "protothread_lock.h"
          #include "protothread_timer.h"
          typedef struct {
              pt_thread_t pt_thread ; pt_func_t pt_func ;
              pt_sem_env_t se ; pt_lock_env_t le ; pt_timer_env_t te ;
          } ctx_t ;
          static struct protothread_s state ;
          static pt_timers_t timers ;
          static pt_lock_t lock ;
          static unsigned sem = 1 ;
          static ctx_t c ;
          static pt_t thr(env_t env) {
              ctx_t *x = env ;
              pt_resume(x) ;
              pt_sem_acquire(x, &x->se, &sem) ;
              pt_sem_release(&x->se, &sem) ;
              pt_lock_acquire_write(x, &x->le, &lock) ;
              pt_lock_release_write(&x->le, &lock) ;
              pt_sleep(x, &x->te, &timers, 10) ;
              return PT_DONE ;
          }
          void app_init(void) {
              protothread_init(&state) ; pt_lock_init(&lock) ;
              pt_timers_init(&timers, 0) ;
              pt_create(&state, &c.pt_thread, thr, &c) ;
          }
          void app_poll(pt_time_t now) {
              pt_timer_run(&state, &timers, now) ;
              while (protothread_run(&state)) { }
          }
          EOF
          for opt in -O0 -O1 -O2 -O3 -Os ; do
            ${{ matrix.cc }} $opt -ffreestanding -DPT_DEBUG=0 -DPT_NO_MALLOC \
              -DPT_NWAIT=1 -Wall -Wextra -Werror -c freestanding.c -o freestanding.o
            syms=$(nm -u freestanding.o | awk '{print $2}' | tr '\n' ' ')
            if [ -n "$syms" ] ; then
              echo "FAIL $opt: expected no libc symbols, got: $syms" ; exit 1
            fi
            echo "$opt: no libc symbols"
          done

  cmake:
    name: cmake build, install and consume
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Default build must not need pthreads
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_INSTALL_PREFIX="$PWD/inst"
          cmake --build build
          ./build/pttest
          test ! -f build/ptbench
          test ! -f build/ptpool
          echo "benchmark and example correctly not built by default"
      - name: Install and consume via pkg-config
        run: |
          set -euo pipefail
          cmake --install build
          test -f inst/include/protothread_timer.h
          export PKG_CONFIG_PATH="$PWD/inst/lib/pkgconfig"
          pkg-config --exists protothread
          echo "version: $(pkg-config --modversion protothread)"
          test "$(pkg-config --modversion protothread)" = "2.0.0"
          printf '#include "protothread.h"\nint main(void){struct protothread_s s;protothread_init(&s);return protothread_run(&s);}\n' > use.c
          gcc $(pkg-config --cflags protothread) use.c -o use $(pkg-config --libs protothread)
          ./use
      - name: Opt-in benchmark and example targets
        run: |
          set -euo pipefail
          cmake -S . -B build-extra -DPROTOTHREAD_BENCH=ON -DPROTOTHREAD_EXAMPLES=ON
          cmake --build build-extra
          ./build-extra/ptpool
          ./build-extra/ptbench 20000 2000

  macos:
    name: macOS (apple clang)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          set -euo pipefail
          for cfg in "" "-DPT_DEBUG=0" "-DPT_NWAIT=1 -DPT_DEBUG=0 -DNDEBUG" ; do
            cc -O2 $cfg -Wall -Wextra -Werror protothread_test.c -o pttest
            ./pttest
            echo "ok: ${cfg:-(default)}"
          done
          cc -O2 -Wall -Wextra -Werror protothread_pool_example.c -o ptpool -lpthread
          ./ptpool
