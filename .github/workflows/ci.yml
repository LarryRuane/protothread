name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # C sources fit in 80 columns, and nothing has tabs or trailing whitespace.
  # Markdown is exempt from the last, since two trailing spaces are a line break.
  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check line length, tabs and trailing whitespace
        run: |
          set -euo pipefail
          fail=0
          if ! git ls-files -z '*.c' '*.h' | xargs -0 awk '
                length > 80 { printf "%s:%d: %d columns\n", FILENAME, FNR, length ; bad = 1 }
                END { exit bad }' ; then
            fail=1
          fi
          if git grep -I -n $'\t' ; then
            echo "tab characters found" ; fail=1
          fi
          if git grep -I -n -E '[[:space:]]+$' -- . ':!*.md' ; then
            echo "trailing whitespace found" ; fail=1
          fi
          exit $fail

  # PT_DEBUG and PT_NWAIT change struct layouts and code paths, and NDEBUG
  # changes which checks survive, so every combination gets exercised.
  test:
    name: test (${{ matrix.cc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v5
      - name: Build and run in every configuration
        run: |
          set -euo pipefail
          fail=0
          for cfg in "" \
                     "-DPT_DEBUG=0" \
                     "-DNDEBUG" \
                     "-DNDEBUG -DPT_DEBUG=0" \
                     "-DPT_NWAIT=1" \
                     "-DPT_NWAIT=4" \
                     "-DPT_NWAIT=1 -DPT_DEBUG=0 -DNDEBUG" ; do
            for opt in -O0 -O1 -O2 -O3 -Os ; do
              printf '%-42s %-4s ' "${cfg:-(default)}" "$opt"
              if ${{ matrix.cc }} $opt $cfg -Wall -Wextra -Werror \
                   protothread_test.c -o pttest 2> err.txt && ./pttest ; then
                echo PASS
              else
                echo FAIL ; sed 's/^/    /' err.txt ; fail=1
              fi
            done
          done
          exit $fail

  standards:
    name: std (${{ matrix.cc }} ${{ matrix.std }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
        std: [c99, c11, c17, c23, gnu99, gnu23]
    steps:
      - uses: actions/checkout@v5
      - run: |
          set -euo pipefail
          # gcc only learned to spell C23 as "c23" in gcc 14; older releases,
          # including the one on ubuntu-24.04, call it "c2x". Use whichever
          # this compiler understands rather than pinning the runner image.
          std="${{ matrix.std }}"
          probe() {
            echo 'int main(void){return 0;}' \
              | ${{ matrix.cc }} -std="$1" -x c - -o /dev/null 2>/dev/null
          }
          if ! probe "$std" ; then
            alt="${std/23/2x}"
            if [ "$alt" != "$std" ] && probe "$alt" ; then
              echo "note: -std=$std unsupported here, using -std=$alt"
              std="$alt"
            else
              echo "neither -std=$std nor -std=$alt is supported" ; exit 1
            fi
          fi
          ${{ matrix.cc }} -std="$std" -O1 -Wall -Wextra -Werror \
            protothread_test.c -o pttest
          ./pttest

  sanitizers:
    name: sanitizers (${{ matrix.cc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v5
      - name: AddressSanitizer + UndefinedBehaviorSanitizer
        run: |
          set -euo pipefail
          for cfg in "" "-DPT_DEBUG=0 -DPT_NWAIT=1" ; do
            ${{ matrix.cc }} -g -O1 $cfg -fsanitize=address,undefined \
              -fno-sanitize-recover=all -Wall -Wextra -Werror \
              protothread_test.c -o pttest-asan
            ./pttest-asan
          done
      - name: ThreadSanitizer on the demos that use POSIX threads
        run: |
          set -euo pipefail
          for d in pool helper_thread ; do
            ${{ matrix.cc }} -g -O1 -fsanitize=thread -Wall -Wextra -Werror \
              -I. demo/$d.c -o $d-tsan -lpthread
            ./$d-tsan
          done

  # The library claims to run with no C library at all. That claim is easy
  # to break by accident with one careless #include, so assert it directly.
  freestanding:
    name: freestanding (no libc symbols)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v5
      - run: |
          set -euo pipefail
          cat > freestanding.c <<'EOF'
          #include "protothread.h"
          #include "protothread_sem.h"
          #include "protothread_lock.h"
          #include "protothread_timer.h"
          typedef struct {
              pt_thread_t pt_thread ; pt_func_t pt_func ;
              pt_sem_env_t se ; pt_lock_env_t le ; pt_timer_env_t te ;
          } ctx_t ;
          static struct protothread_s state ;
          static pt_timers_t timers ;
          static pt_lock_t lock ;
          static unsigned sem = 1 ;
          static ctx_t c ;
          static pt_t thr(env_t env) {
              ctx_t *x = env ;
              pt_resume(x) ;
              pt_sem_acquire(x, &x->se, &sem) ;
              pt_sem_release(&x->se, &sem) ;
              pt_lock_acquire_write(x, &x->le, &lock) ;
              pt_lock_release_write(&x->le, &lock) ;
              pt_sleep(x, &x->te, &timers, 10) ;
              return PT_DONE ;
          }
          void app_init(void) {
              protothread_init(&state) ; pt_lock_init(&lock) ;
              pt_timers_init(&timers, 0) ;
              pt_create(&state, &c.pt_thread, thr, &c) ;
          }
          void app_poll(pt_time_t now) {
              pt_timer_run(&state, &timers, now) ;
              while (protothread_run(&state)) { }
          }
          EOF
          for opt in -O0 -O1 -O2 -O3 -Os ; do
            ${{ matrix.cc }} $opt -ffreestanding -DPT_DEBUG=0 -DPT_NO_MALLOC \
              -DPT_NWAIT=1 -Wall -Wextra -Werror -c freestanding.c -o freestanding.o
            syms=$(nm -u freestanding.o | awk '{print $2}' | tr '\n' ' ')
            if [ -n "$syms" ] ; then
              echo "FAIL $opt: expected no libc symbols, got: $syms" ; exit 1
            fi
            echo "$opt: no libc symbols"
          done

  # The headers are C, but a C++ project should be able to include them.
  # This is a narrow claim and easy to break with one implicit void*
  # conversion, so compile a real protothread -- yields, nesting through the
  # semaphore, lock and timer helpers, and the computed goto -- as C++.
  # Three internal functions require the caller to already be in a critical
  # section. PT_CRITICAL_* are no-ops by default, so a future call from thread
  # context would break that silently and nothing would complain. Define them
  # as a depth counter and PT_CRITICAL_ASSERT() to check it, then run the suite.
  critical-sections:
    name: critical-section discipline (${{ matrix.cc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v5
      - name: Count critical-section depth and assert it where required
        run: |
          set -euo pipefail
          # __builtin_trap(), not assert(): this must survive NDEBUG and
          # PT_DEBUG=0, which are two of the configurations being checked.
          cat > ptcheck.h <<'EOF'
          static int pt_cs_depth ;
          static inline int pt_cs_enter(void) { return pt_cs_depth++ ; }
          static inline void pt_cs_exit(int saved) { pt_cs_depth = saved ; }
          #define PT_CRITICAL_T           int
          #define PT_CRITICAL_ENTER()     pt_cs_enter()
          #define PT_CRITICAL_EXIT(s)     pt_cs_exit(s)
          #define PT_CRITICAL_ASSERT() \
              do { if (pt_cs_depth <= 0) __builtin_trap() ; } while (0)
          EOF

          # Negative control FIRST. If the check cannot fail, the rest of this
          # job proves nothing -- which is exactly how the first draft of it
          # passed while testing an uninstrumented header.
          cat > negative.c <<'EOF'
          #include "protothread.h"
          int main(void) { PT_CRITICAL_ASSERT() ; return 0 ; }
          EOF
          ${{ matrix.cc }} -O1 -Wall -Wextra -Werror -I. -include ptcheck.h \
            negative.c -o negative
          if ./negative ; then
            echo "FAIL: PT_CRITICAL_ASSERT() did not trap at depth 0;" \
                 "the harness is inert and would pass no matter what" >&2
            exit 1
          fi
          echo "negative control trapped as required"

          fail=0
          for cfg in "" "-DPT_DEBUG=0" "-DNDEBUG" "-DPT_NWAIT=1" "-DPT_NWAIT=4" \
                     "-DPT_NWAIT=1 -DPT_DEBUG=0 -DNDEBUG" ; do
            for opt in -O0 -O1 -O2 -Os ; do
              printf '%-38s %-4s ' "${cfg:-(default)}" "$opt"
              if ${{ matrix.cc }} $opt $cfg -Wall -Wextra -Werror -I. \
                   -include ptcheck.h protothread_test.c -o pttest 2> err.txt \
                 && ./pttest > /dev/null ; then
                echo PASS
              else
                echo FAIL ; sed 's/^/    /' err.txt ; fail=1
              fi
            done
          done
          exit $fail

  # A wakeup is a hint, never a promise, so pt_signal() waking only one waiter
  # must be an optimization that nothing depends on.  Build with every signal
  # waking everyone and require that the suite and the demos still pass.
  signal-wakes-all:
    name: signal wakes all (${{ matrix.cc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v5
      - name: Every pt_signal() wakes every waiter
        run: |
          set -euo pipefail
          # Control first.  With two consumers and a producer on one channel, a
          # consumer absorbs the wakeup the producer needed, so this stalls when
          # pt_signal() wakes one waiter and completes when it wakes all of them.
          # If the macro ever stops having that effect, everything below would
          # pass without testing anything.
          cat > control.c <<'EOF'
          #include "protothread.h"
          #define N 100
          static int produced, consumed, mailbox ;
          typedef struct { pt_thread_t pt_thread ; pt_func_t pt_func ; } ctx_t ;

          static pt_t
          producer(env_t const env)
          {
              ctx_t * const c = env ;
              pt_resume(c) ;
              while (produced < N) {
                  while (mailbox) {
                      pt_wait(c, &mailbox) ;
                  }
                  mailbox = ++produced ;
                  pt_signal(pt_get_pt(c), &mailbox) ;
              }
              return PT_DONE ;
          }

          static pt_t
          consumer(env_t const env)
          {
              ctx_t * const c = env ;
              pt_resume(c) ;
              for (;;) {
                  while (mailbox == 0) {
                      pt_wait(c, &mailbox) ;
                  }
                  mailbox = 0 ;
                  consumed++ ;
                  pt_signal(pt_get_pt(c), &mailbox) ;
              }
              return PT_DONE ;
          }

          int
          main(void)
          {
              struct protothread_s s ;
              static ctx_t c[3] ;
              protothread_init(&s) ;
              pt_create(&s, &c[0].pt_thread, consumer, &c[0]) ;
              pt_create(&s, &c[1].pt_thread, consumer, &c[1]) ;
              pt_create(&s, &c[2].pt_thread, producer, &c[2]) ;
              while (protothread_run(&s)) { }
              return consumed != N ;
          }
          EOF
          ${{ matrix.cc }} -O1 -Wall -Wextra -Werror -I. control.c -o wake-one
          ${{ matrix.cc }} -O1 -Wall -Wextra -Werror -I. -DPT_SIGNAL_WAKES_ALL=1 control.c -o wake-all
          if ./wake-one ; then
            echo "FAIL: control completed with wake-one; it should have stalled" >&2
            exit 1
          fi
          if ! ./wake-all ; then
            echo "FAIL: control stalled with PT_SIGNAL_WAKES_ALL=1; the macro had no effect" >&2
            exit 1
          fi
          echo "control: stalls when waking one, completes when waking all"

          fail=0
          for cfg in "" "-DPT_DEBUG=0" "-DNDEBUG" "-DPT_NWAIT=1" "-DPT_NWAIT=1 -DPT_DEBUG=0 -DNDEBUG" ; do
            for opt in -O0 -O2 ; do
              printf '%-36s %-4s ' "${cfg:-(default)}" "$opt"
              if ${{ matrix.cc }} $opt $cfg -DPT_SIGNAL_WAKES_ALL=1 -Wall -Wextra -Werror \
                   protothread_test.c -o pttest 2> err.txt && ./pttest > /dev/null ; then
                echo PASS
              else
                echo FAIL ; sed 's/^/    /' err.txt ; fail=1
              fi
            done
          done
          for d in pool async_io helper_thread ; do
            printf '%-41s ' "demo/$d"
            if ${{ matrix.cc }} -O2 -DPT_SIGNAL_WAKES_ALL=1 -Wall -Wextra -Werror -I. \
                 demo/$d.c -o "$d" -lpthread 2> err.txt && "./$d" > /dev/null ; then
              echo PASS
            else
              echo FAIL ; sed 's/^/    /' err.txt ; fail=1
            fi
          done
          exit $fail

  cplusplus:
    name: C++ (${{ matrix.cxx }} ${{ matrix.std }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cxx: [g++, clang++]
        std: [c++11, c++17, c++20]
    steps:
      - uses: actions/checkout@v5
      - run: |
          set -euo pipefail
          cat > cxx.cpp <<'EOF'
          #include <cstdio>
          #include "protothread.h"
          #include "protothread_sem.h"
          #include "protothread_lock.h"
          #include "protothread_timer.h"

          typedef struct {
              pt_thread_t pt_thread ; pt_func_t pt_func ;
              pt_sem_env_t se ; pt_lock_env_t le ; pt_timer_env_t te ;
              int i ;
          } ctx_t ;

          static struct protothread_s state ;
          static pt_timers_t timers ;
          static pt_lock_t lock ;
          static unsigned sem = 1 ;
          static ctx_t c ;

          static pt_t
          thr(env_t const env)
          {
              /* C++ will not convert void* implicitly, so user code needs this cast */
              ctx_t * const x = static_cast<ctx_t *>(env) ;
              pt_resume(x) ;
              for (x->i = 0; x->i < 3; x->i++) {
                  pt_yield(x) ;
              }
              pt_sem_acquire(x, &x->se, &sem) ;
              pt_sem_release(&x->se, &sem) ;
              pt_lock_acquire_write(x, &x->le, &lock) ;
              pt_lock_release_write(&x->le, &lock) ;
              pt_sleep(x, &x->te, &timers, 10) ;
              return PT_DONE ;
          }

          int
          main(void)
          {
              pt_time_t t ;
              protothread_init(&state) ;
              pt_lock_init(&lock) ;
              pt_timers_init(&timers, 0) ;
              pt_create(&state, &c.pt_thread, thr, &c) ;
              for (t = 0; t <= 20; t++) {
                  pt_timer_run(&state, &timers, t) ;
                  while (protothread_run(&state)) { }
              }
              if (c.i != 3) {
                  std::printf("FAIL: i = %d\n", c.i) ;
                  return 1 ;
              }
              protothread_deinit(&state) ;
              std::printf("ok\n") ;
              return 0 ;
          }
          EOF
          ${{ matrix.cxx }} -std=${{ matrix.std }} -O2 -Wall -Wextra -Werror -I. cxx.cpp -o cxxtest
          ./cxxtest

  cmake:
    name: cmake build, install and consume
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Default build must not need pthreads
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_INSTALL_PREFIX="$PWD/inst"
          cmake --build build
          ./build/pttest
          test ! -f build/ptbench
          for d in ptpool ptaio pthelper ; do test ! -f "build/$d" ; done
          echo "benchmark and demos correctly not built by default"
      - name: Install and consume via pkg-config
        run: |
          set -euo pipefail
          cmake --install build
          test -f inst/include/protothread_timer.h
          export PKG_CONFIG_PATH="$PWD/inst/lib/pkgconfig"
          pkg-config --exists protothread
          echo "version: $(pkg-config --modversion protothread)"
          test "$(pkg-config --modversion protothread)" = "2.0.0"
          printf '#include "protothread.h"\nint main(void){struct protothread_s s;protothread_init(&s);return protothread_run(&s);}\n' > use.c
          gcc $(pkg-config --cflags protothread) use.c -o use $(pkg-config --libs protothread)
          ./use
      - name: Opt-in benchmark and example targets
        run: |
          set -euo pipefail
          cmake -S . -B build-extra -DPROTOTHREAD_BENCH=ON -DPROTOTHREAD_DEMOS=ON
          cmake --build build-extra
          ./build-extra/ptpool
          ./build-extra/ptaio
          ./build-extra/pthelper
          ./build-extra/ptbench 20000 2000

  macos:
    name: macOS (apple clang)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          set -euo pipefail
          for cfg in "" "-DPT_DEBUG=0" "-DPT_NWAIT=1 -DPT_DEBUG=0 -DNDEBUG" ; do
            cc -O2 $cfg -Wall -Wextra -Werror protothread_test.c -o pttest
            ./pttest
            echo "ok: ${cfg:-(default)}"
          done
          for d in pool async_io helper_thread ; do
            cc -O2 -Wall -Wextra -Werror -I. demo/$d.c -o "$d" -lpthread
            "./$d"
          done
